version: 2
updates:
  # NOTE: the npm ecosystem is deliberately NOT enabled here. Dependabot
  # resolves npm updates into package-lock.json and cannot regenerate
  # bun.lock, so every npm PR fails `bun install --frozen-lockfile` in CI.
  # Dependency updates are done manually: `bun update` + the full gate chain.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
