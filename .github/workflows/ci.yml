name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma validate + generate
        run: |
          bunx prisma validate
          bunx prisma generate

      - name: Type check (src)
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log || true
          if grep -qE "^src/" /tmp/tsc.log; then echo "Type errors in src/:"; grep -E "^src/" /tmp/tsc.log; exit 1; fi

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Prepare demo database
        run: |
          bun run db:push
          bun run seed:demo

      - name: Boot dev server + API smoke suite
        run: |
          bun run dev & 
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health --max-time 5 || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          bash tests/api-smoke.sh

      - name: Security notes
        run: |
          echo "Secrets scan: fail on committed .env"
          if git ls-files --error-unmatch .env 2>/dev/null; then echo "::error::.env is committed"; exit 1; fi
          echo "OK — .env not in git"
