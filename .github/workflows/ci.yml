name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI runs in demo mode: demo product surfaces stay reachable for smoke.
      DEMO_MODE: "true"
      JWT_SECRET: ci-pipeline-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma validate + generate
        run: |
          bunx prisma validate
          bunx prisma generate

      - name: Type check (src)
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log || true
          if grep -qE "^src/" /tmp/tsc.log; then echo "Type errors in src/:"; grep -E "^src/" /tmp/tsc.log; exit 1; fi

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Prepare demo database (full seed chain)
        run: |
          bun run db:push
          bun run seed:all

      - name: Boot dev server + API smoke suite
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health --max-time 5 || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          bash tests/api-smoke.sh

      - name: Security notes
        run: |
          echo "Secrets scan: fail on committed .env"
          if git ls-files --error-unmatch .env 2>/dev/null; then echo "::error::.env is committed"; exit 1; fi
          echo "OK — .env not in git"

  build:
    # A passing test suite is not enough — the production standalone build
    # must compile too (this gate was previously missing entirely).
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: file:/tmp/build.db
      JWT_SECRET: ci-pipeline-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Production build (standalone)
        run: bun run build
