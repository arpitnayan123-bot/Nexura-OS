name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Postgres + Redis are the production datastores (pg-migration-1,
    # stateless-1): unit tests and the API smoke suite run against REAL
    # services, not SQLite stand-ins.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexura
          POSTGRES_PASSWORD: nexura
          POSTGRES_DB: nexura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI runs in demo mode: demo product surfaces stay reachable for smoke.
      DEMO_MODE: "true"
      JWT_SECRET: ci-pipeline-secret-not-for-production-0123456789
      DATABASE_URL: postgresql://nexura:nexura@127.0.0.1:5432/nexura
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma validate + generate
        run: |
          bunx prisma validate
          bunx prisma generate

      - name: Type check (src)
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log || true
          if grep -qE "^src/" /tmp/tsc.log; then echo "Type errors in src/:"; grep -E "^src/" /tmp/tsc.log; exit 1; fi

      - name: Lint
        run: bun run lint

      - name: Apply migrations (release gate)
        run: bunx prisma migrate deploy

      - name: Seed demo database (idempotent)
        # Real-DB unit tests (consent ledger, permissions, money) are authored
        # against the seeded demo dataset — same reality as local dev. The seed
        # is idempotent, so the later smoke-suite stage reuses this state.
        run: bun run seed:all

      - name: Unit tests (against Postgres + Redis services)
        run: bun run test

      - name: Boot dev server + API smoke suite
        run: |
          # dev:real = plain `next dev` — the default `dev` guardian wrapper
          # hardcodes the local sandbox path and cannot run on CI runners.
          bun run dev:real &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health --max-time 5 || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          bash tests/api-smoke.sh

      - name: Security notes
        run: |
          echo "Secrets scan: fail on committed .env"
          if git ls-files --error-unmatch .env 2>/dev/null; then echo "::error::.env is committed"; exit 1; fi
          echo "OK — .env not in git"

  build:
    # A passing test suite is not enough — the production standalone build
    # must compile too (this gate was previously missing entirely).
    runs-on: ubuntu-latest
    needs: verify
    env:
      # Build-time dummy only (module evaluation); the real URL is
      # provided by the deployment environment at runtime.
      DATABASE_URL: postgresql://build:nobuild@127.0.0.1:5432/nobuild
      JWT_SECRET: ci-pipeline-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Production build (standalone)
        run: bun run build
