# Nexura Hospital OS — local production-like stack
# Usage: docker compose up --build
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.docker
      required: false
    environment:
      DATABASE_URL: file:/app/db/custom.db
      # Deployments MUST override via .env.docker or the environment —
      # this placeholder only exists so a local smoke stack can boot.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-deployments-please}
      NEXURA_MODE: local
      EMAIL_TRANSPORT: console
      DEMO_MODE: "true"
    volumes:
      - app-db:/app/db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  # ---------- Postgres profile (HaaS / enterprise deployments) ----------
  # Usage: DATABASE_URL=postgres://nexura:nexura@db:5432/nexura docker compose --profile postgres up
  # The app image is dialect-agnostic (Prisma + src/lib/nx/db-dialect.ts):
  # switching provider is an env change, not a code change.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexura-local-only}
      POSTGRES_DB: nexura
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexura"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db:
  pg-data:
